<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crie seu Produto</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<h1>🚀 Agência de Marketing</h1>

<p>
Crie seu produto e veja sua propaganda ganhar vida!
</p>

<div class="formulario">

<input id="nome" placeholder="Nome do Produto">

<input id="marca" placeholder="Marca">

<input id="preco" placeholder="Preço">

<input id="publico" placeholder="Público-alvo">

<input id="cor" type="color">

<textarea id="descricao" placeholder="Descreva seu produto"></textarea>

<input id="slogan" placeholder="Slogan">

<select id="emoji">

<option>🍕</option>
<option>🥤</option>
<option>📱</option>
<option>🎮</option>
<option>👟</option>
<option>🧴</option>
<option>🍫</option>
<option>☕</option>
<option>🚲</option>
<option>🎧</option>

</select>

<button onclick="criar()">Criar Propaganda</button>

</div>

<div id="resultado" class="propaganda">

<h2>Seu anúncio aparecerá aqui</h2>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
